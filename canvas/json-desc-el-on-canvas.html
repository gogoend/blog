<canvas id="canvasEl" width="1280" height="720"></canvas>
<canvas id="pickingCanvasEl" width="1280" height="720"></canvas>
<script>

  // 获取 canvas 和 2D 上下文
  const canvas = document.getElementById('canvasEl');
  const ctx = canvas.getContext('2d');

  const elements = [
    {
      type: "rect",
      position: [100, 200],
      size: [100, 100],
      fillColor: "#0f0",
      strokeColor: "#f0f",
      strokeSize: 4,
    },
    {
      type: "circle",
      position: [200, 100],
      radius: 40,
      fillColor: "#00f",
      strokeColor: "#048",
      strokeSize: 8,
    },
    {
      type: "text",
      position: [300, 10],
      fontSize: 48,
      content: "Hello World",
      fillColor: "#ddd",
      strokeColor: "#666",
      strokeSize: 1,
      rotation: 30,
    },
    {
      type: "star",
      position: [600, 320],
      angleQuantity: 6,
      innerRadius: 30,
      outerRadius: 50,
      fillColor: "#ddd",
      strokeColor: "#808",
      strokeSize: 1,
    },
  ];

  // 创建离屏Canvas用于颜色编码拾取
  const pickingCanvas = document.getElementById('pickingCanvasEl');
  pickingCanvas.width = canvas.width;
  pickingCanvas.height = canvas.height;
  const pickingCtx = pickingCanvas.getContext('2d');

  // 为每个元素分配唯一的颜色
  const colorMap = new Map();
  const elementMap = new Map();
  
  // 选中的元素
  let selectedElement = null;

  // 生成唯一颜色的函数
  function generateUniqueColor(index) {
    index += 1
    // 使用索引生成唯一的RGB颜色
    const r = (index * 137) % 256;
    const g = (index * 173) % 256;
    const b = (index * 191) % 256;
    return `rgb(${r}, ${g}, ${b})`;
  }

  // 初始化颜色映射
  function initColorMap() {
    colorMap.clear();
    elementMap.clear();
    elements.forEach((element, index) => {
      const color = generateUniqueColor(index);
      colorMap.set(element, color);
      elementMap.set(color, element);
    });
  }

  // 绘制所有元素到主Canvas
  function drawToCanvas() {
    // 清空主Canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 绘制所有元素
    elements.forEach((item) => {
      switch (item.type) {
        case "rect":
          drawRect(item, ctx);
          break;
        case "circle":
          drawCircle(item, ctx);
          break;
        case "text":
          drawText(item, ctx);
          break;
        case "star":
          drawStar(item, ctx);
          break;
        default:
          console.warn("未知类型:", item.type);
      }
    });

    // 为选中的元素添加高亮效果
    if (selectedElement) {
      drawSelectedHighlight(selectedElement, ctx);
    }
  }

  // 绘制选中元素的高亮效果
  function drawSelectedHighlight(element, ctx) {
    ctx.save();
    ctx.strokeStyle = "#f00";
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);

    switch (element.type) {
      case "rect":
        drawRectOBB(element, ctx);
        break;
      case "circle":
        drawCircleOBB(element, ctx);
        break;
      case "text":
        drawTextOBB(element, ctx);
        break;
      case "star":
        drawStarOBB(element, ctx);
        break;
      default:
        break;
    }

    ctx.restore();
  }

  // 绘制矩形的OBB包围盒
  function drawRectOBB(element, ctx) {
    const [x, y] = element.position;
    const [width, height] = element.size;
    ctx.strokeRect(x - 2, y - 2, width + 4, height + 4);
  }

  // 绘制圆形的OBB包围盒（外接正方形）
  function drawCircleOBB(element, ctx) {
    const [x, y] = element.position;
    const radius = element.radius;
    const size = radius * 2;
    ctx.strokeRect(x - radius - 2, y - radius - 2, size + 4, size + 4);
  }

  // 绘制文本的OBB包围盒
  function drawTextOBB(element, ctx) {
    const [x, y] = element.position;
    const fontSize = element.fontSize;
    const content = element.content;
    const rotation = element.rotation || 0;
    
    // 平移到文本位置
    ctx.translate(x, y);
    
    // 旋转文本
    ctx.rotate(rotation * Math.PI / 180);
    
    // 测量文本宽度
    ctx.font = `${fontSize}px sans-serif`;
    const metrics = ctx.measureText(content);
    const textWidth = metrics.width;
    const textHeight = fontSize * 1.2;
    
    // 绘制OBB包围盒
    ctx.strokeRect(-2, -2, textWidth + 4, textHeight + 4);
    
    // 恢复状态
    ctx.restore();
  }

  // 绘制星形的OBB包围盒
  function drawStarOBB(element, ctx) {
    const [x, y] = element.position;
    const outerRadius = element.outerRadius;
    // 星形的OBB包围盒是其外接正方形
    const size = outerRadius * 2;
    ctx.strokeRect(x - outerRadius - 2, y - outerRadius - 2, size + 4, size + 4);
  }

  // 绘制颜色编码到拾取Canvas
  function drawToPickingBuffer() {
    // 清空拾取缓冲区
    pickingCtx.clearRect(0, 0, pickingCanvas.width, pickingCanvas.height);

    // 绘制所有元素到拾取Canvas，使用唯一颜色
    elements.forEach((item) => {
      const color = colorMap.get(item);
      switch (item.type) {
        case "rect":
          drawPickingRect(item, pickingCtx, color);
          break;
        case "circle":
          drawPickingCircle(item, pickingCtx, color);
          break;
        case "text":
          drawPickingText(item, pickingCtx, color);
          break;
        case "star":
          drawPickingStar(item, pickingCtx, color);
          break;
        default:
          console.warn("未知类型:", item.type);
      }
    });
  }

  // 执行绘制
  function redraw() {
    initColorMap();
    drawToPickingBuffer();
    drawToCanvas();
  }
  
  // 初始绘制
  redraw();

  // 添加鼠标点击事件监听
  canvas.addEventListener('click', handleClick);

  function handleClick(e) {
    // 获取点击位置相对于Canvas的坐标
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor(e.clientX - rect.left);
    const y = Math.floor(e.clientY - rect.top);

    // 确保坐标在Canvas范围内
    if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) {
      // 点击空白区域，取消选中
      selectedElement = null;
      redraw();
      console.log('未点击到任何元素');
      return;
    }

    // 从拾取Canvas获取颜色
    const imageData = pickingCtx.getImageData(x, y, 1, 1);
    const [r, g, b] = imageData.data;
    const color = `rgb(${r}, ${g}, ${b})`;

    // 查找对应的元素
    const element = elementMap.get(color);
    if (element) {
      // 选中元素
      selectedElement = element;
      redraw();
      console.log('点击了元素:', element);
    } else {
      // 点击空白区域，取消选中
      selectedElement = null;
      redraw();
      console.log('未点击到任何元素');
    }
  }

  // 绘制颜色编码的矩形
  function drawPickingRect(element, ctx, color) {
    const [x, y] = element.position;
    const [width, height] = element.size;
    
    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);
  }

  // 绘制颜色编码的圆形
  function drawPickingCircle(element, ctx, color) {
    const [x, y] = element.position;
    const radius = element.radius;
    
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, 2 * Math.PI);
    ctx.fill();
  }

  // 绘制颜色编码的文本
  function drawPickingText(element, ctx, color) {
    const [x, y] = element.position;
    const fontSize = element.fontSize;
    const content = element.content;
    const rotation = element.rotation || 0;
    
    ctx.save();
    
    // 平移到文本位置
    ctx.translate(x, y);
    
    // 旋转文本
    ctx.rotate(rotation * Math.PI / 180);
    
    // 测量文本宽度
    ctx.font = `${fontSize}px sans-serif`;
    const metrics = ctx.measureText(content);
    const textWidth = metrics.width;
    const textHeight = fontSize * 1.2; // 估算文本高度
    
    // 绘制文本的外部包围盒
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, textWidth, textHeight);
    
    ctx.restore();
  }

  // 绘制颜色编码的星形
  function drawPickingStar(element, ctx, color) {
    const [cx, cy] = element.position;
    const n = element.angleQuantity;
    const innerRadius = element.innerRadius;
    const outerRadius = element.outerRadius;
    const step = Math.PI / n;
    let rot = (Math.PI / 2) * 3;
    
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 2 * n; i++) {
      const r = i % 2 === 0 ? outerRadius : innerRadius;
      const angle = rot + i * step;
      const px = cx + r * Math.cos(angle);
      const py = cy + r * Math.sin(angle);
      
      if (i === 0) {
        ctx.moveTo(px, py);
      } else {
        ctx.lineTo(px, py);
      }
    }
    ctx.closePath();
    ctx.fill();
  }

  // ---------- 绘制函数 ----------
  function drawRect({ position, size, fillColor, strokeColor, strokeSize }, ctx) {
    const [x, y] = position;
    const [width, height] = size;

    ctx.save(); // 保存当前状态
    ctx.fillStyle = fillColor;
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = strokeSize;

    // 先填充，再描边，避免描边被填充覆盖一半
    ctx.fillRect(x, y, width, height);
    ctx.strokeRect(x, y, width, height);
    ctx.restore();
  }

  function drawCircle({
    position,
    radius,
    fillColor,
    strokeColor,
    strokeSize,
  }, ctx) {
    const [x, y] = position;

    ctx.save();
    ctx.fillStyle = fillColor;
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = strokeSize;

    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawText({
    position,
    fontSize,
    content,
    fillColor,
    strokeColor,
    strokeSize,
    rotation = 0,
  }, ctx) {
    const [x, y] = position;

    ctx.save();
    
    // 平移到文本位置
    ctx.translate(x, y);
    
    // 旋转文本
    ctx.rotate(rotation * Math.PI / 180);
    
    // 绘制文本
    ctx.font = `${fontSize}px sans-serif`;
    ctx.fillStyle = fillColor;
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = strokeSize;

    // 设定文本基线为 top，让 position 表示文本左上角（更符合直觉）
    ctx.textBaseline = "top";
    ctx.textAlign = "left";

    // 先填充后描边
    ctx.fillText(content, 0, 0);
    ctx.strokeText(content, 0, 0);
    
    ctx.restore();
  }

  function drawStar({
    position,
    angleQuantity,
    innerRadius,
    outerRadius,
    fillColor,
    strokeColor,
    strokeSize,
  }, ctx) {
    const [cx, cy] = position;
    const n = angleQuantity; // 角数
    const step = Math.PI / n; // 每个点之间的角度步长（内外交替）
    let rot = (Math.PI / 2) * 3; // 起始角度设为 -90°（让第一个顶点朝上），也可调整

    ctx.save();
    ctx.fillStyle = fillColor;
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = strokeSize;

    ctx.beginPath();
    for (let i = 0; i < 2 * n; i++) {
      // 根据 i 的奇偶决定半径：偶数 i 为外顶点，奇数 i 为内顶点
      const r = i % 2 === 0 ? outerRadius : innerRadius;
      // 当前点的角度
      const angle = rot + i * step;
      // 计算坐标
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);

      if (i === 0) {
        ctx.moveTo(x, y);
      } else {
        ctx.lineTo(x, y);
      }
    }
    ctx.closePath(); // 闭合路径

    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
</script>
