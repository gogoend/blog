<canvas id="canvasEl" width="1280" height="720"></canvas>
<canvas id="pickingCanvasEl" width="1280" height="720"></canvas>
<script>

  // 获取 canvas 和 2D 上下文
  const canvas = document.getElementById('canvasEl');
  const ctx = canvas.getContext('2d');

  const elements = [
    {
      type: "circle",
      position: [140, 200],
      radius: 40,
      fillColor: "#00f",
      strokeColor: "#048",
      strokeSize: 8,
    },
    {
      type: "rect",
      position: [100, 200],
      size: [100, 100],
      fillColor: "#0f0",
      strokeColor: "#f0f",
      strokeSize: 4,
    },
    {
      type: "text",
      position: [300, 10],
      fontSize: 48,
      content: "Hello World",
      fillColor: "#ddd",
      strokeColor: "#666",
      strokeSize: 1,
      rotation: 30,
    },
    {
      type: "star",
      position: [600, 320],
      angleQuantity: 6,
      innerRadius: 30,
      outerRadius: 50,
      fillColor: "#ddd",
      strokeColor: "#808",
      strokeSize: 1,
    },
  ];

  // 创建离屏Canvas用于颜色编码拾取
  const pickingCanvas = document.getElementById('pickingCanvasEl');
  pickingCanvas.width = canvas.width;
  pickingCanvas.height = canvas.height;
  const pickingCtx = pickingCanvas.getContext('2d');

  // 为每个元素分配唯一的颜色
  const colorMap = new Map();
  const elementMap = new Map();
  
  // 选中的元素集合
  let selectedElements = new Set();

  // 蚂蚁线动画偏移
  let highlightDashOffset = 0;
  
  // 多选相关变量
  let isSelecting = false;
  let selectionStart = { x: 0, y: 0 };
  let selectionEnd = { x: 0, y: 0 };

  // 生成唯一颜色的函数
  function generateUniqueColor(index) {
    index += 1
    // 使用索引生成唯一的RGB颜色
    const r = (index * 137) % 256;
    const g = (index * 173) % 256;
    const b = (index * 191) % 256;
    return `rgb(${r}, ${g}, ${b})`;
  }

  // 初始化颜色映射
  function initColorMap() {
    colorMap.clear();
    elementMap.clear();
    elements.forEach((element, index) => {
      const color = generateUniqueColor(index);
      colorMap.set(element, color);
      elementMap.set(color, element);
    });
  }

  // 绘制所有元素到主Canvas
  function drawToCanvas() {
    // 清空主Canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 绘制所有元素
    elements.forEach((item) => {
      switch (item.type) {
        case "rect":
          drawRect(item, ctx);
          break;
        case "circle":
          drawCircle(item, ctx);
          break;
        case "text":
          drawText(item, ctx);
          break;
        case "star":
          drawStar(item, ctx);
          break;
        default:
          console.warn("未知类型:", item.type);
      }
    });
    
    // 绘制选择矩形
    if (isSelecting) {
      drawSelectionRect();
    }
    
    // 为选中的元素添加高亮效果
    selectedElements.forEach(element => {
      drawSelectedHighlight(element, ctx);
    });
  }

  // 绘制选择矩形
  function drawSelectionRect() {
    const x = Math.min(selectionStart.x, selectionEnd.x);
    const y = Math.min(selectionStart.y, selectionEnd.y);
    const width = Math.abs(selectionEnd.x - selectionStart.x);
    const height = Math.abs(selectionEnd.y - selectionStart.y);

    ctx.save();
    ctx.strokeStyle = "rgba(0, 0, 255, 0.5)";
    ctx.fillStyle = "rgba(0, 0, 255, 0.1)";
    ctx.lineWidth = 1;
    ctx.fillRect(x, y, width, height);
    ctx.strokeRect(x, y, width, height);
    ctx.restore();
  }

  // 绘制选中元素的高亮效果
  function drawSelectedHighlight(element, ctx) {
    ctx.save();
    ctx.strokeStyle = "#f00";
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.lineDashOffset = -highlightDashOffset;

    switch (element.type) {
      case "rect":
        drawRectOBB(element, ctx);
        break;
      case "circle":
        drawCircleOBB(element, ctx);
        break;
      case "text":
        drawTextOBB(element, ctx);
        break;
      case "star":
        drawStarOBB(element, ctx);
        break;
      default:
        break;
    }

    ctx.restore();
  }

  function startHighlightAnimation() {
    const step = () => {
      highlightDashOffset = (highlightDashOffset + 1) % 10;
      drawToCanvas();
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  // 绘制矩形的OBB包围盒
  function drawRectOBB(element, ctx) {
    const [x, y] = element.position;
    const [width, height] = element.size;
    ctx.strokeRect(x - 2, y - 2, width + 4, height + 4);
  }

  // 绘制圆形的OBB包围盒（外接正方形）
  function drawCircleOBB(element, ctx) {
    const [x, y] = element.position;
    const radius = element.radius;
    const size = radius * 2;
    ctx.strokeRect(x - radius - 2, y - radius - 2, size + 4, size + 4);
  }

  // 绘制文本的OBB包围盒
  function drawTextOBB(element, ctx) {
    const [x, y] = element.position;
    const fontSize = element.fontSize;
    const content = element.content;
    const rotation = element.rotation || 0;
    
    // 保存当前状态
    ctx.save();
    
    // 平移到文本位置
    ctx.translate(x, y);
    
    // 旋转文本
    ctx.rotate(rotation * Math.PI / 180);
    
    // 测量文本宽度
    ctx.font = `${fontSize}px sans-serif`;
    const metrics = ctx.measureText(content);
    const textWidth = metrics.width;
    const textHeight = fontSize * 1.2;
    
    // 绘制OBB包围盒
    ctx.strokeRect(-2, -2, textWidth + 4, textHeight + 4);
    
    // 恢复状态
    ctx.restore();
  }

  // 绘制星形的OBB包围盒
  function drawStarOBB(element, ctx) {
    const [x, y] = element.position;
    const outerRadius = element.outerRadius;
    // 星形的OBB包围盒是其外接正方形
    const size = outerRadius * 2;
    ctx.strokeRect(x - outerRadius - 2, y - outerRadius - 2, size + 4, size + 4);
  }

  // 绘制颜色编码到拾取Canvas
  function drawToPickingBuffer() {
    // 清空拾取缓冲区
    pickingCtx.clearRect(0, 0, pickingCanvas.width, pickingCanvas.height);

    // 绘制所有元素到拾取Canvas，使用唯一颜色
    elements.forEach((item) => {
      const color = colorMap.get(item);
      switch (item.type) {
        case "rect":
          drawPickingRect(item, pickingCtx, color);
          break;
        case "circle":
          drawPickingCircle(item, pickingCtx, color);
          break;
        case "text":
          drawPickingText(item, pickingCtx, color);
          break;
        case "star":
          drawPickingStar(item, pickingCtx, color);
          break;
        default:
          console.warn("未知类型:", item.type);
      }
    });
  }

  // 执行绘制
  function redraw() {
    initColorMap();
    drawToPickingBuffer();
    drawToCanvas();
  }
  
  // 初始绘制
  redraw();
  startHighlightAnimation();

  // 添加鼠标事件监听
  canvas.addEventListener('mousedown', handleMouseDown);
  canvas.addEventListener('mousemove', handleMouseMove);
  canvas.addEventListener('mouseup', handleMouseUp);
  canvas.addEventListener('dblclick', handleDoubleClick);

  function handleClick(e) {
    // 获取点击位置相对于Canvas的坐标
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor(e.clientX - rect.left);
    const y = Math.floor(e.clientY - rect.top);

    // 确保坐标在Canvas范围内
    if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) {
      // 点击空白区域，取消选中
      selectedElements.clear();
      redraw();
      return;
    }

    // 从拾取Canvas获取颜色
    const imageData = pickingCtx.getImageData(x, y, 1, 1);
    const [r, g, b] = imageData.data;
    const color = `rgb(${r}, ${g}, ${b})`;

    // 查找对应的元素
    const element = elementMap.get(color);
    if (element) {
      // 如果Ctrl键被按下，则添加到选择集，否则清空选择集
      if (e.ctrlKey || e.metaKey) {
        if (selectedElements.has(element)) {
          selectedElements.delete(element);
        } else {
          selectedElements.add(element);
        }
      } else {
        selectedElements.clear();
        selectedElements.add(element);
      }
      redraw();
    } else {
      // 点击空白区域，取消选中
      selectedElements.clear();
      redraw();
    }
  }

  function handleDoubleClick(e) {
    // 获取双击位置相对于Canvas的坐标
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor(e.clientX - rect.left);
    const y = Math.floor(e.clientY - rect.top);

    // 确保坐标在Canvas范围内
    if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) {
      return;
    }

    // 从拾取Canvas获取颜色
    const imageData = pickingCtx.getImageData(x, y, 1, 1);
    const [r, g, b] = imageData.data;
    const color = `rgb(${r}, ${g}, ${b})`;

    // 只处理文本元素
    const element = elementMap.get(color);
    if (!element || element.type !== "text") return;

    const next = window.prompt("编辑文本", element.content);
    if (next === null) return;
    element.content = String(next);
    redraw();
  }

  // 处理鼠标按下事件
  function handleMouseDown(e) {
    // 获取鼠标位置相对于Canvas的坐标
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    // 开始选择
    isSelecting = true;
    selectionStart = { x, y };
    selectionEnd = { x, y };
  }

  // 处理鼠标移动事件
  function handleMouseMove(e) {
    if (isSelecting) {
      // 获取鼠标位置相对于Canvas的坐标
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      // 更新选择矩形
      selectionEnd = { x, y };
      redraw();
    }
  }

  // 处理鼠标释放事件
  function handleMouseUp(e) {
    if (isSelecting) {
      // 更新鼠标抬起位置
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      selectionEnd = { x, y };

      // 结束选择
      isSelecting = false;

      // 计算选择矩形
      const selectionRect = {
        x: Math.min(selectionStart.x, selectionEnd.x),
        y: Math.min(selectionStart.y, selectionEnd.y),
        width: Math.abs(selectionEnd.x - selectionStart.x),
        height: Math.abs(selectionEnd.y - selectionStart.y)
      };

      const dragThreshold = 2; // 小于该阈值视为单击
      const isClick =
        selectionRect.width <= dragThreshold &&
        selectionRect.height <= dragThreshold;

      if (isClick) {
        // 单击按颜色拾取处理
        handleClick(e);
      } else {
        // 选择与矩形相交的元素
        selectElementsInRect(selectionRect);

        // 重新绘制
        redraw();

        // 阻止点击事件的触发
        e.stopPropagation();
        e.preventDefault();
      }
    }
  }

  // 选择与矩形相交的元素
  function selectElementsInRect(rect) {
    // 清空之前的选择
    selectedElements.clear();

    // 检查每个元素是否与选择矩形相交
    elements.forEach(element => {
      // 使用正确的相交检测函数
      const intersects = isElementIntersectsRect(element, rect);

      if (intersects) {
        selectedElements.add(element);
      }
    });
  }

  // 检查元素的OBB包围盒是否与矩形相交
  function isElementIntersectsRect(element, rect) {
    const obbPoints = getElementOBBPoints(element);
    if (!obbPoints) return false;
    return doPolygonsIntersect(obbPoints, rectToPolygon(rect));
  }

  function rectToPolygon(rect) {
    return [
      { x: rect.x, y: rect.y },
      { x: rect.x + rect.width, y: rect.y },
      { x: rect.x + rect.width, y: rect.y + rect.height },
      { x: rect.x, y: rect.y + rect.height }
    ];
  }

  function rotatePoints(points, origin, angleRad) {
    const cos = Math.cos(angleRad);
    const sin = Math.sin(angleRad);
    return points.map(point => {
      const dx = point.x - origin.x;
      const dy = point.y - origin.y;
      return {
        x: dx * cos - dy * sin + origin.x,
        y: dx * sin + dy * cos + origin.y
      };
    });
  }

  // 获取元素的OBB四个角点
  function getElementOBBPoints(element) {
    switch (element.type) {
      case "rect": {
        const [x, y] = element.position;
        const [width, height] = element.size;
        const rotation = element.rotation || 0;
        const points = [
          { x, y },
          { x: x + width, y },
          { x: x + width, y: y + height },
          { x, y: y + height }
        ];
        if (!rotation) return points;
        return rotatePoints(points, { x, y }, rotation * Math.PI / 180);
      }
      case "circle": {
        const [cx, cy] = element.position;
        const radius = element.radius;
        const size = radius * 2;
        return [
          { x: cx - radius, y: cy - radius },
          { x: cx - radius + size, y: cy - radius },
          { x: cx - radius + size, y: cy - radius + size },
          { x: cx - radius, y: cy - radius + size }
        ];
      }
      case "text": {
        const [tx, ty] = element.position;
        const fontSize = element.fontSize;
        const content = element.content;
        const rotation = element.rotation || 0;
        ctx.font = `${fontSize}px sans-serif`;
        const metrics = ctx.measureText(content);
        const textWidth = metrics.width;
        const textHeight = fontSize * 1.2;
        const points = [
          { x: tx, y: ty },
          { x: tx + textWidth, y: ty },
          { x: tx + textWidth, y: ty + textHeight },
          { x: tx, y: ty + textHeight }
        ];
        if (!rotation) return points;
        return rotatePoints(points, { x: tx, y: ty }, rotation * Math.PI / 180);
      }
      case "star": {
        const [cx, cy] = element.position;
        const outerRadius = element.outerRadius;
        const rotation = element.rotation || 0;
        const size = outerRadius * 2;
        const points = [
          { x: cx - outerRadius, y: cy - outerRadius },
          { x: cx - outerRadius + size, y: cy - outerRadius },
          { x: cx - outerRadius + size, y: cy - outerRadius + size },
          { x: cx - outerRadius, y: cy - outerRadius + size }
        ];
        if (!rotation) return points;
        return rotatePoints(points, { x: cx, y: cy }, rotation * Math.PI / 180);
      }
      default:
        return null;
    }
  }

  // 检查两个多边形是否相交
  function doPolygonsIntersect(polygon1, polygon2) {
    // 检查第一个多边形的每条边是否与第二个多边形的边相交
    for (let i = 0; i < polygon1.length; i++) {
      const p1 = polygon1[i];
      const p2 = polygon1[(i + 1) % polygon1.length];
      
      for (let j = 0; j < polygon2.length; j++) {
        const p3 = polygon2[j];
        const p4 = polygon2[(j + 1) % polygon2.length];
        
        if (doLinesIntersect(p1, p2, p3, p4)) {
          return true;
        }
      }
    }
    
    // 检查第一个多边形是否完全包含在第二个多边形内
    if (isPointInPolygon(polygon1[0], polygon2)) {
      return true;
    }
    
    // 检查第二个多边形是否完全包含在第一个多边形内
    if (isPointInPolygon(polygon2[0], polygon1)) {
      return true;
    }
    
    return false;
  }

  // 检查两条线段是否相交
  function doLinesIntersect(p1, p2, p3, p4) {
    const denominator = (p4.y - p3.y) * (p2.x - p1.x) - (p4.x - p3.x) * (p2.y - p1.y);
    
    if (denominator === 0) {
      return false; // 线段平行
    }
    
    const ua = ((p4.x - p3.x) * (p1.y - p3.y) - (p4.y - p3.y) * (p1.x - p3.x)) / denominator;
    const ub = ((p2.x - p1.x) * (p1.y - p3.y) - (p2.y - p1.y) * (p1.x - p3.x)) / denominator;
    
    return ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1;
  }

  // 检查点是否在多边形内
  function isPointInPolygon(point, polygon) {
    let inside = false;
    for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
      const xi = polygon[i].x, yi = polygon[i].y;
      const xj = polygon[j].x, yj = polygon[j].y;
      
      const intersect = ((yi > point.y) !== (yj > point.y)) && 
                       (point.x < (xj - xi) * (point.y - yi) / (yj - yi) + xi);
      
      if (intersect) {
        inside = !inside;
      }
    }
    return inside;
  }

  // 绘制颜色编码的矩形
  function drawPickingRect(element, ctx, color) {
    const [x, y] = element.position;
    const [width, height] = element.size;
    
    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);
  }

  // 绘制颜色编码的圆形
  function drawPickingCircle(element, ctx, color) {
    const [x, y] = element.position;
    const radius = element.radius;
    
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, 2 * Math.PI);
    ctx.fill();
  }

  // 绘制颜色编码的文本
  function drawPickingText(element, ctx, color) {
    const [x, y] = element.position;
    const fontSize = element.fontSize;
    const content = element.content;
    const rotation = element.rotation || 0;
    
    ctx.save();
    
    // 平移到文本位置
    ctx.translate(x, y);
    
    // 旋转文本
    ctx.rotate(rotation * Math.PI / 180);
    
    // 测量文本宽度
    ctx.font = `${fontSize}px sans-serif`;
    const metrics = ctx.measureText(content);
    const textWidth = metrics.width;
    const textHeight = fontSize * 1.2; // 估算文本高度
    
    // 绘制文本的外部包围盒
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, textWidth, textHeight);
    
    ctx.restore();
  }

  // 绘制颜色编码的星形
  function drawPickingStar(element, ctx, color) {
    const [cx, cy] = element.position;
    const n = element.angleQuantity;
    const innerRadius = element.innerRadius;
    const outerRadius = element.outerRadius;
    const step = Math.PI / n;
    let rot = (Math.PI / 2) * 3;
    
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 2 * n; i++) {
      const r = i % 2 === 0 ? outerRadius : innerRadius;
      const angle = rot + i * step;
      const px = cx + r * Math.cos(angle);
      const py = cy + r * Math.sin(angle);
      
      if (i === 0) {
        ctx.moveTo(px, py);
      } else {
        ctx.lineTo(px, py);
      }
    }
    ctx.closePath();
    ctx.fill();
  }

  // ---------- 绘制函数 ----------
  function drawRect({ position, size, fillColor, strokeColor, strokeSize }, ctx) {
    const [x, y] = position;
    const [width, height] = size;

    ctx.save(); // 保存当前状态
    ctx.fillStyle = fillColor;
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = strokeSize;

    // 先填充，再描边，避免描边被填充覆盖一半
    ctx.fillRect(x, y, width, height);
    ctx.strokeRect(x, y, width, height);
    ctx.restore();
  }

  function drawCircle({
    position,
    radius,
    fillColor,
    strokeColor,
    strokeSize,
  }, ctx) {
    const [x, y] = position;

    ctx.save();
    ctx.fillStyle = fillColor;
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = strokeSize;

    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawText({
    position,
    fontSize,
    content,
    fillColor,
    strokeColor,
    strokeSize,
    rotation = 0,
  }, ctx) {
    const [x, y] = position;

    ctx.save();
    
    // 平移到文本位置
    ctx.translate(x, y);
    
    // 旋转文本
    ctx.rotate(rotation * Math.PI / 180);
    
    // 绘制文本
    ctx.font = `${fontSize}px sans-serif`;
    ctx.fillStyle = fillColor;
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = strokeSize;

    // 设定文本基线为 top，让 position 表示文本左上角（更符合直觉）
    ctx.textBaseline = "top";
    ctx.textAlign = "left";

    // 先填充后描边
    ctx.fillText(content, 0, 0);
    ctx.strokeText(content, 0, 0);
    
    ctx.restore();
  }

  function drawStar({
    position,
    angleQuantity,
    innerRadius,
    outerRadius,
    fillColor,
    strokeColor,
    strokeSize,
  }, ctx) {
    const [cx, cy] = position;
    const n = angleQuantity; // 角数
    const step = Math.PI / n; // 每个点之间的角度步长（内外交替）
    let rot = (Math.PI / 2) * 3; // 起始角度设为 -90°（让第一个顶点朝上），也可调整

    ctx.save();
    ctx.fillStyle = fillColor;
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = strokeSize;

    ctx.beginPath();
    for (let i = 0; i < 2 * n; i++) {
      // 根据 i 的奇偶决定半径：偶数 i 为外顶点，奇数 i 为内顶点
      const r = i % 2 === 0 ? outerRadius : innerRadius;
      // 当前点的角度
      const angle = rot + i * step;
      // 计算坐标
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);

      if (i === 0) {
        ctx.moveTo(x, y);
      } else {
        ctx.lineTo(x, y);
      }
    }
    ctx.closePath(); // 闭合路径

    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
</script>
