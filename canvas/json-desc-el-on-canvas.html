<canvas id="canvasEl" width="1280" height="720"></canvas>
<canvas id="offscreenCanvasEl" width="1280" height="720"></canvas>
<script>

  // 获取 canvas 和 2D 上下文
  const canvas = document.getElementById('canvasEl');
  const ctx = canvas.getContext('2d');

  const elements = [
    {
      type: "rect",
      position: [100, 200],
      size: [100, 100],
      fillColor: "#0f0",
      strokeColor: "#f0f",
      strokeSize: 4,
    },
    {
      type: "circle",
      position: [200, 100],
      radius: 40,
      fillColor: "#00f",
      strokeColor: "#048",
      strokeSize: 8,
    },
    {
      type: "text",
      position: [300, 10],
      fontSize: 48,
      content: "Hello World",
      fillColor: "#ddd",
      strokeColor: "#666",
      strokeSize: 1,
    },
    {
      type: "star",
      position: [600, 320],
      angleQuantity: 6,
      innerRadius: 30,
      outerRadius: 50,
      fillColor: "#ddd",
      strokeColor: "#808",
      strokeSize: 1,
    },
  ];

  // 创建离屏Canvas作为缓冲区
  const offscreenCanvas = document.getElementById('offscreenCanvasEl');
  offscreenCanvas.width = canvas.width;
  offscreenCanvas.height = canvas.height;
  const offscreenCtx = offscreenCanvas.getContext('2d');

  // 绘制所有元素到离屏Canvas
  function drawToBuffer() {
    // 清空缓冲区
    offscreenCtx.clearRect(0, 0, offscreenCanvas.width, offscreenCanvas.height);

    // 绘制所有元素
    elements.forEach((item) => {
      switch (item.type) {
        case "rect":
          drawRect(item, offscreenCtx);
          break;
        case "circle":
          drawCircle(item, offscreenCtx);
          break;
        case "text":
          drawText(item, offscreenCtx);
          break;
        case "star":
          drawStar(item, offscreenCtx);
          break;
        default:
          console.warn("未知类型:", item.type);
      }
    });
  }

  // 将缓冲区内容绘制到主Canvas
  function drawToCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(offscreenCanvas, 0, 0);
  }

  // 执行双缓冲绘制
  drawToBuffer();
  drawToCanvas();

  // 添加鼠标点击事件监听
  canvas.addEventListener('click', handleClick);

  function handleClick(e) {
    // 获取点击位置相对于Canvas的坐标
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    // 从后往前检查元素（后绘制的元素在上面）
    for (let i = elements.length - 1; i >= 0; i--) {
      const element = elements[i];
      if (isPointInElement(x, y, element)) {
        console.log('点击了元素:', element);
        return; // 找到第一个命中的元素后返回
      }
    }
    console.log('未点击到任何元素');
  }

  // 检查点是否在元素内
  function isPointInElement(x, y, element) {
    switch (element.type) {
      case "rect":
        return isPointInRect(x, y, element);
      case "circle":
        return isPointInCircle(x, y, element);
      case "text":
        return isPointInText(x, y, element);
      case "star":
        return isPointInStar(x, y, element);
      default:
        return false;
    }
  }

  // 检查点是否在矩形内
  function isPointInRect(x, y, element) {
    const [rx, ry] = element.position;
    const [width, height] = element.size;
    return x >= rx && x <= rx + width && y >= ry && y <= ry + height;
  }

  // 检查点是否在圆形内
  function isPointInCircle(x, y, element) {
    const [cx, cy] = element.position;
    const radius = element.radius;
    const dx = x - cx;
    const dy = y - cy;
    return dx * dx + dy * dy <= radius * radius;
  }

  // 检查点是否在文本内
  function isPointInText(x, y, element) {
    const [tx, ty] = element.position;
    const fontSize = element.fontSize;
    const content = element.content;

    ctx.save();
    ctx.font = `${fontSize}px sans-serif`;
    ctx.textBaseline = "top";
    ctx.textAlign = "left";

    // 测量文本宽度
    const metrics = ctx.measureText(content);
    const textWidth = metrics.width;
    const textHeight = fontSize * 1.2; // 估算文本高度

    ctx.restore();

    return x >= tx && x <= tx + textWidth && y >= ty && y <= ty + textHeight;
  }

  // 检查点是否在星形内
  function isPointInStar(x, y, element) {
    const [cx, cy] = element.position;
    const n = element.angleQuantity;
    const innerRadius = element.innerRadius;
    const outerRadius = element.outerRadius;
    const step = Math.PI / n;
    let rot = (Math.PI / 2) * 3;

    // 创建星形路径
    ctx.save();
    ctx.beginPath();
    for (let i = 0; i < 2 * n; i++) {
      const r = i % 2 === 0 ? outerRadius : innerRadius;
      const angle = rot + i * step;
      const px = cx + r * Math.cos(angle);
      const py = cy + r * Math.sin(angle);

      if (i === 0) {
        ctx.moveTo(px, py);
      } else {
        ctx.lineTo(px, py);
      }
    }
    ctx.closePath();

    // 检查点是否在路径内
    const isInside = ctx.isPointInPath(x, y);
    ctx.restore();

    return isInside;
  }

  // ---------- 绘制函数 ----------
  function drawRect({ position, size, fillColor, strokeColor, strokeSize }, ctx) {
    const [x, y] = position;
    const [width, height] = size;

    ctx.save(); // 保存当前状态
    ctx.fillStyle = fillColor;
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = strokeSize;

    // 先填充，再描边，避免描边被填充覆盖一半
    ctx.fillRect(x, y, width, height);
    ctx.strokeRect(x, y, width, height);
    ctx.restore();
  }

  function drawCircle({
    position,
    radius,
    fillColor,
    strokeColor,
    strokeSize,
  }, ctx) {
    const [x, y] = position;

    ctx.save();
    ctx.fillStyle = fillColor;
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = strokeSize;

    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawText({
    position,
    fontSize,
    content,
    fillColor,
    strokeColor,
    strokeSize,
  }, ctx) {
    const [x, y] = position;

    ctx.save();
    ctx.font = `${fontSize}px sans-serif`;
    ctx.fillStyle = fillColor;
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = strokeSize;

    // 设定文本基线为 top，让 position 表示文本左上角（更符合直觉）
    ctx.textBaseline = "top";
    ctx.textAlign = "left";

    // 先填充后描边
    ctx.fillText(content, x, y);
    ctx.strokeText(content, x, y);
    ctx.restore();
  }

  function drawStar({
    position,
    angleQuantity,
    innerRadius,
    outerRadius,
    fillColor,
    strokeColor,
    strokeSize,
  }, ctx) {
    const [cx, cy] = position;
    const n = angleQuantity; // 角数
    const step = Math.PI / n; // 每个点之间的角度步长（内外交替）
    let rot = (Math.PI / 2) * 3; // 起始角度设为 -90°（让第一个顶点朝上），也可调整

    ctx.save();
    ctx.fillStyle = fillColor;
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = strokeSize;

    ctx.beginPath();
    for (let i = 0; i < 2 * n; i++) {
      // 根据 i 的奇偶决定半径：偶数 i 为外顶点，奇数 i 为内顶点
      const r = i % 2 === 0 ? outerRadius : innerRadius;
      // 当前点的角度
      const angle = rot + i * step;
      // 计算坐标
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);

      if (i === 0) {
        ctx.moveTo(x, y);
      } else {
        ctx.lineTo(x, y);
      }
    }
    ctx.closePath(); // 闭合路径

    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
</script>
