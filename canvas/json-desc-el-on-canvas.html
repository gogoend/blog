<canvas id="canvasEl" width="1280" height="720"></canvas>
<canvas id="pickingCanvasEl" width="1280" height="720"></canvas>
<script>

  // 获取 canvas 和 2D 上下文
  const canvas = document.getElementById('canvasEl');
  const ctx = canvas.getContext('2d');

  const elements = [
    {
      type: "circle",
      position: [150, 250],
      radius: 40,
      fillColor: "#00f",
      strokeColor: "#048",
      strokeSize: 8,
    },
    {
      type: "rect",
      position: [100, 200],
      size: [100, 100],
      fillColor: "#0f0",
      strokeColor: "#f0f",
      strokeSize: 4,
    },
    {
      type: "text",
      position: [300, 10],
      fontSize: 48,
      content: "Hello World",
      fillColor: "#ddd",
      strokeColor: "#666",
      strokeSize: 1,
      rotation: 30,
    },
    {
      type: "star",
      position: [600, 320],
      angleQuantity: 6,
      innerRadius: 30,
      outerRadius: 50,
      fillColor: "#ddd",
      strokeColor: "#808",
      strokeSize: 1,
    },
  ];

  // 创建离屏Canvas用于颜色编码拾取
  const pickingCanvas = document.getElementById('pickingCanvasEl');
  pickingCanvas.width = canvas.width;
  pickingCanvas.height = canvas.height;
  const pickingCtx = pickingCanvas.getContext('2d');

  // 为每个元素分配唯一的颜色
  const colorMap = new Map();
  const elementMap = new Map();
  
  // 选中的元素集合
  let selectedElements = new Set();
  
  // 多选相关变量
  let isSelecting = false;
  let selectionStart = { x: 0, y: 0 };
  let selectionEnd = { x: 0, y: 0 };
  let justFinishedSelection = false;

  // 生成唯一颜色的函数
  function generateUniqueColor(index) {
    index += 1
    // 使用索引生成唯一的RGB颜色
    const r = (index * 137) % 256;
    const g = (index * 173) % 256;
    const b = (index * 191) % 256;
    return `rgb(${r}, ${g}, ${b})`;
  }

  // 初始化颜色映射
  function initColorMap() {
    colorMap.clear();
    elementMap.clear();
    elements.forEach((element, index) => {
      const color = generateUniqueColor(index);
      colorMap.set(element, color);
      elementMap.set(color, element);
    });
  }

  // 绘制所有元素到主Canvas
  function drawToCanvas() {
    // 清空主Canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 绘制所有元素
    elements.forEach((item) => {
      switch (item.type) {
        case "rect":
          drawRect(item, ctx);
          break;
        case "circle":
          drawCircle(item, ctx);
          break;
        case "text":
          drawText(item, ctx);
          break;
        case "star":
          drawStar(item, ctx);
          break;
        default:
          console.warn("未知类型:", item.type);
      }
    });
    
    // 绘制选择矩形
    if (isSelecting) {
      drawSelectionRect();
    }
    
    // 为选中的元素添加高亮效果
    console.log('开始绘制高亮效果，选中元素数量:', selectedElements.size);
    selectedElements.forEach(element => {
      console.log('绘制元素高亮:', element.type);
      drawSelectedHighlight(element, ctx);
    });
  }

  // 绘制选择矩形
  function drawSelectionRect() {
    const x = Math.min(selectionStart.x, selectionEnd.x);
    const y = Math.min(selectionStart.y, selectionEnd.y);
    const width = Math.abs(selectionEnd.x - selectionStart.x);
    const height = Math.abs(selectionEnd.y - selectionStart.y);

    ctx.save();
    ctx.strokeStyle = "rgba(0, 0, 255, 0.5)";
    ctx.fillStyle = "rgba(0, 0, 255, 0.1)";
    ctx.lineWidth = 1;
    ctx.fillRect(x, y, width, height);
    ctx.strokeRect(x, y, width, height);
    ctx.restore();
  }

  // 绘制选中元素的高亮效果
  function drawSelectedHighlight(element, ctx) {
    ctx.save();
    ctx.strokeStyle = "#f00";
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);

    switch (element.type) {
      case "rect":
        drawRectOBB(element, ctx);
        break;
      case "circle":
        drawCircleOBB(element, ctx);
        break;
      case "text":
        drawTextOBB(element, ctx);
        break;
      case "star":
        drawStarOBB(element, ctx);
        break;
      default:
        break;
    }

    ctx.restore();
  }

  // 绘制矩形的OBB包围盒
  function drawRectOBB(element, ctx) {
    const [x, y] = element.position;
    const [width, height] = element.size;
    ctx.strokeRect(x - 2, y - 2, width + 4, height + 4);
  }

  // 绘制圆形的OBB包围盒（外接正方形）
  function drawCircleOBB(element, ctx) {
    const [x, y] = element.position;
    const radius = element.radius;
    const size = radius * 2;
    ctx.strokeRect(x - radius - 2, y - radius - 2, size + 4, size + 4);
  }

  // 绘制文本的OBB包围盒
  function drawTextOBB(element, ctx) {
    const [x, y] = element.position;
    const fontSize = element.fontSize;
    const content = element.content;
    const rotation = element.rotation || 0;
    
    // 保存当前状态
    ctx.save();
    
    // 平移到文本位置
    ctx.translate(x, y);
    
    // 旋转文本
    ctx.rotate(rotation * Math.PI / 180);
    
    // 测量文本宽度
    ctx.font = `${fontSize}px sans-serif`;
    const metrics = ctx.measureText(content);
    const textWidth = metrics.width;
    const textHeight = fontSize * 1.2;
    
    // 绘制OBB包围盒
    ctx.strokeRect(-2, -2, textWidth + 4, textHeight + 4);
    
    // 恢复状态
    ctx.restore();
  }

  // 绘制星形的OBB包围盒
  function drawStarOBB(element, ctx) {
    const [x, y] = element.position;
    const outerRadius = element.outerRadius;
    // 星形的OBB包围盒是其外接正方形
    const size = outerRadius * 2;
    ctx.strokeRect(x - outerRadius - 2, y - outerRadius - 2, size + 4, size + 4);
  }

  // 绘制颜色编码到拾取Canvas
  function drawToPickingBuffer() {
    // 清空拾取缓冲区
    pickingCtx.clearRect(0, 0, pickingCanvas.width, pickingCanvas.height);

    // 绘制所有元素到拾取Canvas，使用唯一颜色
    elements.forEach((item) => {
      const color = colorMap.get(item);
      switch (item.type) {
        case "rect":
          drawPickingRect(item, pickingCtx, color);
          break;
        case "circle":
          drawPickingCircle(item, pickingCtx, color);
          break;
        case "text":
          drawPickingText(item, pickingCtx, color);
          break;
        case "star":
          drawPickingStar(item, pickingCtx, color);
          break;
        default:
          console.warn("未知类型:", item.type);
      }
    });
  }

  // 执行绘制
  function redraw() {
    initColorMap();
    drawToPickingBuffer();
    drawToCanvas();
  }
  
  // 初始绘制
  redraw();

  // 添加鼠标事件监听
  canvas.addEventListener('click', handleClick);
  canvas.addEventListener('mousedown', handleMouseDown);
  canvas.addEventListener('mousemove', handleMouseMove);
  canvas.addEventListener('mouseup', handleMouseUp);

  function handleClick(e) {
    // 如果正在选择矩形或刚刚完成选择，不处理点击事件
    if (isSelecting || justFinishedSelection) {
      console.log('正在选择矩形或刚刚完成选择，忽略点击事件');
      return;
    }

    // 获取点击位置相对于Canvas的坐标
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor(e.clientX - rect.left);
    const y = Math.floor(e.clientY - rect.top);

    // 确保坐标在Canvas范围内
    if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) {
      // 点击空白区域，取消选中
      selectedElements.clear();
      redraw();
      console.log('未点击到任何元素');
      return;
    }

    // 从拾取Canvas获取颜色
    const imageData = pickingCtx.getImageData(x, y, 1, 1);
    const [r, g, b] = imageData.data;
    const color = `rgb(${r}, ${g}, ${b})`;

    // 查找对应的元素
    const element = elementMap.get(color);
    if (element) {
      // 如果Ctrl键被按下，则添加到选择集，否则清空选择集
      if (e.ctrlKey || e.metaKey) {
        if (selectedElements.has(element)) {
          selectedElements.delete(element);
        } else {
          selectedElements.add(element);
        }
      } else {
        selectedElements.clear();
        selectedElements.add(element);
      }
      redraw();
      console.log('点击了元素:', element);
    } else {
      // 点击空白区域，取消选中
      selectedElements.clear();
      redraw();
      console.log('未点击到任何元素');
    }
  }

  // 处理鼠标按下事件
  function handleMouseDown(e) {
    // 获取鼠标位置相对于Canvas的坐标
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    // 开始选择
    isSelecting = true;
    selectionStart = { x, y };
    selectionEnd = { x, y };
  }

  // 处理鼠标移动事件
  function handleMouseMove(e) {
    if (isSelecting) {
      // 获取鼠标位置相对于Canvas的坐标
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      // 更新选择矩形
      selectionEnd = { x, y };
      redraw();
    }
  }

  // 处理鼠标释放事件
  function handleMouseUp(e) {
    if (isSelecting) {
      // 结束选择
      isSelecting = false;
      justFinishedSelection = true;

      // 计算选择矩形
      const selectionRect = {
        x: Math.min(selectionStart.x, selectionEnd.x),
        y: Math.min(selectionStart.y, selectionEnd.y),
        width: Math.abs(selectionEnd.x - selectionStart.x),
        height: Math.abs(selectionEnd.y - selectionStart.y)
      };

      console.log('选择矩形:', selectionRect);

      // 选择与矩形相交的元素
      selectElementsInRect(selectionRect);

      // 重新绘制
      redraw();

      // 阻止点击事件的触发
      e.stopPropagation();
      e.preventDefault();

      // 重置标志
      setTimeout(() => {
        justFinishedSelection = false;
      }, 100);
    }
  }

  // 选择与矩形相交的元素
  function selectElementsInRect(rect) {
    // 清空之前的选择
    selectedElements.clear();

    // 检查每个元素是否与选择矩形相交
    elements.forEach(element => {
      // 使用正确的相交检测函数
      const intersects = isElementIntersectsRect(element, rect);

      console.log('元素', element.type, '是否与选择矩形相交:', intersects);
      if (intersects) {
        selectedElements.add(element);
      }
    });

    console.log('选中的元素:', Array.from(selectedElements));
  }

  // 检查元素的OBB包围盒是否与矩形相交
  function isElementIntersectsRect(element, rect) {
    switch (element.type) {
      case "rect":
        return isOBBIntersectsRect(element, rect);
      case "circle":
        return isCircleIntersectsRect(element, rect);
      case "text":
        return isTextOBBIntersectsRect(element, rect);
      case "star":
        return isStarIntersectsRect(element, rect);
      default:
        return false;
    }
  }

  // 检查矩形OBB与选择矩形的相交
  function isOBBIntersectsRect(element, rect) {
    const [x, y] = element.position;
    const [width, height] = element.size;
    const rotation = element.rotation || 0;
    
    if (rotation === 0) {
      // 未旋转，使用AABB检测
      return (
        x < rect.x + rect.width &&
        x + width > rect.x &&
        y < rect.y + rect.height &&
        y + height > rect.y
      );
    } else {
      // 已旋转，使用OBB检测
      const angle = rotation * Math.PI / 180;
      
      // 计算矩形的四个角点
      const points = [
        { x, y },
        { x: x + width, y },
        { x: x + width, y: y + height },
        { x, y: y + height }
      ];
      
      // 旋转每个点
      const rotatedPoints = points.map(point => {
        const rotatedX = (point.x - x) * Math.cos(angle) - (point.y - y) * Math.sin(angle) + x;
        const rotatedY = (point.x - x) * Math.sin(angle) + (point.y - y) * Math.cos(angle) + y;
        return { x: rotatedX, y: rotatedY };
      });
      
      // 检查选择矩形是否与旋转后的矩形相交
      return doPolygonsIntersect(rotatedPoints, [
        { x: rect.x, y: rect.y },
        { x: rect.x + rect.width, y: rect.y },
        { x: rect.x + rect.width, y: rect.y + rect.height },
        { x: rect.x, y: rect.y + rect.height }
      ]);
    }
  }

  // 检查圆形与选择矩形的相交
  function isCircleIntersectsRect(element, rect) {
    const [cx, cy] = element.position;
    const radius = element.radius;
    
    // 找到矩形上离圆心最近的点
    const closestX = Math.max(rect.x, Math.min(cx, rect.x + rect.width));
    const closestY = Math.max(rect.y, Math.min(cy, rect.y + rect.height));
    
    // 计算圆心到最近点的距离
    const dx = cx - closestX;
    const dy = cy - closestY;
    const distanceSquared = dx * dx + dy * dy;
    
    // 检查距离是否小于等于半径的平方
    return distanceSquared <= radius * radius;
  }

  // 检查文本OBB与选择矩形的相交
  function isTextOBBIntersectsRect(element, rect) {
    const [tx, ty] = element.position;
    const fontSize = element.fontSize;
    const content = element.content;
    const rotation = element.rotation || 0;
    
    // 测量文本宽度
    ctx.font = `${fontSize}px sans-serif`;
    const metrics = ctx.measureText(content);
    const textWidth = metrics.width;
    const textHeight = fontSize * 1.2;
    
    if (rotation === 0) {
      // 文本未旋转，使用AABB检测
      return (
        tx < rect.x + rect.width &&
        tx + textWidth > rect.x &&
        ty < rect.y + rect.height &&
        ty + textHeight > rect.y
      );
    } else {
      // 文本已旋转，使用OBB检测
      const angle = rotation * Math.PI / 180;
      
      // 计算文本的四个角点
      const points = [
        { x: tx, y: ty },
        { x: tx + textWidth, y: ty },
        { x: tx + textWidth, y: ty + textHeight },
        { x: tx, y: ty + textHeight }
      ];
      
      // 旋转每个点
      const rotatedPoints = points.map(point => {
        const rotatedX = (point.x - tx) * Math.cos(angle) - (point.y - ty) * Math.sin(angle) + tx;
        const rotatedY = (point.x - tx) * Math.sin(angle) + (point.y - ty) * Math.cos(angle) + ty;
        return { x: rotatedX, y: rotatedY };
      });
      
      // 检查选择矩形是否与旋转后的文本边界相交
      return doPolygonsIntersect(rotatedPoints, [
        { x: rect.x, y: rect.y },
        { x: rect.x + rect.width, y: rect.y },
        { x: rect.x + rect.width, y: rect.y + rect.height },
        { x: rect.x, y: rect.y + rect.height }
      ]);
    }
  }

  // 检查星形与选择矩形的相交
  function isStarIntersectsRect(element, rect) {
    const [sx, sy] = element.position;
    const n = element.angleQuantity;
    const innerRadius = element.innerRadius;
    const outerRadius = element.outerRadius;
    const step = Math.PI / n;
    let rot = (Math.PI / 2) * 3;
    
    // 计算星形的所有顶点
    const points = [];
    for (let i = 0; i < 2 * n; i++) {
      const r = i % 2 === 0 ? outerRadius : innerRadius;
      const angle = rot + i * step;
      const x = sx + r * Math.cos(angle);
      const y = sy + r * Math.sin(angle);
      points.push({ x, y });
    }
    
    // 检查选择矩形是否与星形相交
    return doPolygonsIntersect(points, [
      { x: rect.x, y: rect.y },
      { x: rect.x + rect.width, y: rect.y },
      { x: rect.x + rect.width, y: rect.y + rect.height },
      { x: rect.x, y: rect.y + rect.height }
    ]);
  }

  // 检查两个多边形是否相交
  function doPolygonsIntersect(polygon1, polygon2) {
    // 检查第一个多边形的每条边是否与第二个多边形的边相交
    for (let i = 0; i < polygon1.length; i++) {
      const p1 = polygon1[i];
      const p2 = polygon1[(i + 1) % polygon1.length];
      
      for (let j = 0; j < polygon2.length; j++) {
        const p3 = polygon2[j];
        const p4 = polygon2[(j + 1) % polygon2.length];
        
        if (doLinesIntersect(p1, p2, p3, p4)) {
          return true;
        }
      }
    }
    
    // 检查第一个多边形是否完全包含在第二个多边形内
    if (isPointInPolygon(polygon1[0], polygon2)) {
      return true;
    }
    
    // 检查第二个多边形是否完全包含在第一个多边形内
    if (isPointInPolygon(polygon2[0], polygon1)) {
      return true;
    }
    
    return false;
  }

  // 检查两条线段是否相交
  function doLinesIntersect(p1, p2, p3, p4) {
    const denominator = (p4.y - p3.y) * (p2.x - p1.x) - (p4.x - p3.x) * (p2.y - p1.y);
    
    if (denominator === 0) {
      return false; // 线段平行
    }
    
    const ua = ((p4.x - p3.x) * (p1.y - p3.y) - (p4.y - p3.y) * (p1.x - p3.x)) / denominator;
    const ub = ((p2.x - p1.x) * (p1.y - p3.y) - (p2.y - p1.y) * (p1.x - p3.x)) / denominator;
    
    return ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1;
  }

  // 检查点是否在多边形内
  function isPointInPolygon(point, polygon) {
    let inside = false;
    for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
      const xi = polygon[i].x, yi = polygon[i].y;
      const xj = polygon[j].x, yj = polygon[j].y;
      
      const intersect = ((yi > point.y) !== (yj > point.y)) && 
                       (point.x < (xj - xi) * (point.y - yi) / (yj - yi) + xi);
      
      if (intersect) {
        inside = !inside;
      }
    }
    return inside;
  }

  // 绘制颜色编码的矩形
  function drawPickingRect(element, ctx, color) {
    const [x, y] = element.position;
    const [width, height] = element.size;
    
    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);
  }

  // 绘制颜色编码的圆形
  function drawPickingCircle(element, ctx, color) {
    const [x, y] = element.position;
    const radius = element.radius;
    
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, 2 * Math.PI);
    ctx.fill();
  }

  // 绘制颜色编码的文本
  function drawPickingText(element, ctx, color) {
    const [x, y] = element.position;
    const fontSize = element.fontSize;
    const content = element.content;
    const rotation = element.rotation || 0;
    
    ctx.save();
    
    // 平移到文本位置
    ctx.translate(x, y);
    
    // 旋转文本
    ctx.rotate(rotation * Math.PI / 180);
    
    // 测量文本宽度
    ctx.font = `${fontSize}px sans-serif`;
    const metrics = ctx.measureText(content);
    const textWidth = metrics.width;
    const textHeight = fontSize * 1.2; // 估算文本高度
    
    // 绘制文本的外部包围盒
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, textWidth, textHeight);
    
    ctx.restore();
  }

  // 绘制颜色编码的星形
  function drawPickingStar(element, ctx, color) {
    const [cx, cy] = element.position;
    const n = element.angleQuantity;
    const innerRadius = element.innerRadius;
    const outerRadius = element.outerRadius;
    const step = Math.PI / n;
    let rot = (Math.PI / 2) * 3;
    
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 2 * n; i++) {
      const r = i % 2 === 0 ? outerRadius : innerRadius;
      const angle = rot + i * step;
      const px = cx + r * Math.cos(angle);
      const py = cy + r * Math.sin(angle);
      
      if (i === 0) {
        ctx.moveTo(px, py);
      } else {
        ctx.lineTo(px, py);
      }
    }
    ctx.closePath();
    ctx.fill();
  }

  // ---------- 绘制函数 ----------
  function drawRect({ position, size, fillColor, strokeColor, strokeSize }, ctx) {
    const [x, y] = position;
    const [width, height] = size;

    ctx.save(); // 保存当前状态
    ctx.fillStyle = fillColor;
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = strokeSize;

    // 先填充，再描边，避免描边被填充覆盖一半
    ctx.fillRect(x, y, width, height);
    ctx.strokeRect(x, y, width, height);
    ctx.restore();
  }

  function drawCircle({
    position,
    radius,
    fillColor,
    strokeColor,
    strokeSize,
  }, ctx) {
    const [x, y] = position;

    ctx.save();
    ctx.fillStyle = fillColor;
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = strokeSize;

    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawText({
    position,
    fontSize,
    content,
    fillColor,
    strokeColor,
    strokeSize,
    rotation = 0,
  }, ctx) {
    const [x, y] = position;

    ctx.save();
    
    // 平移到文本位置
    ctx.translate(x, y);
    
    // 旋转文本
    ctx.rotate(rotation * Math.PI / 180);
    
    // 绘制文本
    ctx.font = `${fontSize}px sans-serif`;
    ctx.fillStyle = fillColor;
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = strokeSize;

    // 设定文本基线为 top，让 position 表示文本左上角（更符合直觉）
    ctx.textBaseline = "top";
    ctx.textAlign = "left";

    // 先填充后描边
    ctx.fillText(content, 0, 0);
    ctx.strokeText(content, 0, 0);
    
    ctx.restore();
  }

  function drawStar({
    position,
    angleQuantity,
    innerRadius,
    outerRadius,
    fillColor,
    strokeColor,
    strokeSize,
  }, ctx) {
    const [cx, cy] = position;
    const n = angleQuantity; // 角数
    const step = Math.PI / n; // 每个点之间的角度步长（内外交替）
    let rot = (Math.PI / 2) * 3; // 起始角度设为 -90°（让第一个顶点朝上），也可调整

    ctx.save();
    ctx.fillStyle = fillColor;
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = strokeSize;

    ctx.beginPath();
    for (let i = 0; i < 2 * n; i++) {
      // 根据 i 的奇偶决定半径：偶数 i 为外顶点，奇数 i 为内顶点
      const r = i % 2 === 0 ? outerRadius : innerRadius;
      // 当前点的角度
      const angle = rot + i * step;
      // 计算坐标
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);

      if (i === 0) {
        ctx.moveTo(x, y);
      } else {
        ctx.lineTo(x, y);
      }
    }
    ctx.closePath(); // 闭合路径

    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
</script>
